# ============================================
# Docker Compose para Producción
# Inferno Club con Nginx Proxy Manager
# ============================================

services:
  # ============================================
  # Aplicación Laravel (PHP-FPM)
  # ============================================
  app:
    image: oppadev/inferno-club:latest
    container_name: inferno_app
    restart: unless-stopped
    # Sin puertos expuestos - Solo comunicación interna
    networks:
      - inferno_network
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=${APP_URL}
      - TRUST_PROXIES=*
      - LOG_CHANNEL=stack
      - LOG_LEVEL=info
      
      # Database
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      
      # Mail
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME="${MAIL_FROM_NAME}"
    volumes:
      - app_public:/var/www/html/public:ro
      - storage_data:/var/www/html/storage/app
      - logs_data:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ============================================
  # Nginx (Para Nginx Proxy Manager)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: inferno_nginx
    restart: unless-stopped
    # Sin puertos expuestos - NPM se conecta internamente via red 'proxy'
    networks:
      - inferno_network
      - proxy
    volumes:
      - app_public:/var/www/html/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: inferno_postgres
    restart: unless-stopped
    # Solo red interna - No accesible desde fuera
    networks:
      - inferno_network
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

# ============================================
# Networks
# ============================================
networks:
  # Red interna privada - Solo para comunicación entre contenedores
  inferno_network:
    driver: bridge
    internal: false
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/24
          gateway: 172.25.0.1
  
  # Red externa para NPM - Solo nginx está aquí
  proxy:
    external: true

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  storage_data:
    driver: local
  logs_data:
    driver: local
  app_public:
    driver: local
